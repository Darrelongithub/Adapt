<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1276" viewBox="0 0 1180 1276">
<rect width="1180" height="1276" fill="#ffffff"/>
<text x="32" y="44" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Adapt console</text>
<text x="32" y="70" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">rendered from the console's own renderer; every value traces to an endpoint</text>
<rect x="20" y="96" width="1140" height="1" fill="#e5e7eb"/>
<text x="32" y="118" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Abstention</text>
<text x="32" y="142" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">rate</text>
<text x="32" y="162" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">no data</text>
<text x="32" y="186" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">abstentions / decisions</text>
<text x="32" y="206" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">0 / 0</text>
<text x="32" y="230" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">95% interval</text>
<text x="32" y="250" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">interval unavailable</text>
<text x="32" y="274" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">served, same denominator</text>
<text x="32" y="294" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">no data</text>
<text x="32" y="318" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">reasons</text>
<text x="32" y="338" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">no abstentions in 0 decisions</text>
<text x="32" y="362" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">excluded, and counted</text>
<text x="32" y="382" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">0 test, 0 paused, 0 replays</text>
<text x="32" y="406" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563">No decisions in this window, so there is no rate to report — not a 0% one.</text>
<text x="32" y="428" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563">0% abstention on a quiet tenant is not success: it means nothing was asked. The pair is always</text>
<text x="32" y="446" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563">shown together because either number alone can be gamed.</text>
<rect x="20" y="464" width="1140" height="1" fill="#e5e7eb"/>
<text x="32" y="486" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Credits</text>
<text x="32" y="510" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">available</text>
<text x="32" y="530" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">78</text>
<text x="32" y="554" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">consumed</text>
<text x="32" y="574" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">22</text>
<text x="32" y="598" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">held</text>
<text x="32" y="618" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">0</text>
<text x="32" y="642" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">granted</text>
<text x="32" y="662" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">100</text>
<text x="32" y="686" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563">granted = available + held + consumed + forfeited; consumption reads settles only, so an</text>
<text x="32" y="704" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563">abstention costs nothing.</text>
<rect x="20" y="722" width="1140" height="1" fill="#e5e7eb"/>
<text x="32" y="744" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Connections</text>
<text x="32" y="768" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#111827">host   |   environment   |   status   |   monthly quota   |   decisions   |   abstention</text>
<text x="32" y="790" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#374151">console-host | test | active | 50000 | 0 | no data</text>
<text x="32" y="812" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#374151">console-host-quiet | test | active | 50000 | 0 | no data</text>
<rect x="20" y="830" width="1140" height="1" fill="#e5e7eb"/>
<text x="32" y="852" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Polling check</text>
<text x="32" y="876" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">baseline repeat ratio</text>
<text x="32" y="896" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">0.00</text>
<text x="32" y="920" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">connections alerting</text>
<text x="32" y="940" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">0</text>
<text x="32" y="964" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">alert threshold</text>
<text x="32" y="984" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">5.0x baseline</text>
<text x="32" y="1008" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563">No connection is repeating decide on the same learner above 5.0x the baseline, across 0</text>
<text x="32" y="1026" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563">connections with decisions in this window and a 10-repeat floor. A host retrying for a</text>
<text x="32" y="1044" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563">non-abstention shows up here, not in the bill.</text>
<rect x="20" y="1062" width="1140" height="1" fill="#e5e7eb"/>
<text x="32" y="1084" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">By connection</text>
<text x="32" y="1108" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563">No decisions in this window. Nothing to break down — and nothing to celebrate.</text>
<text x="32" y="1130" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563">Last-event time and event volume per connection are not on any endpoint yet (UI.md 2.3 asks for</text>
<text x="32" y="1148" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563">both). The quota and the decision count are; nothing here is invented.</text>
<rect x="20" y="1166" width="1140" height="1" fill="#e5e7eb"/>
<text x="32" y="1188" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Learner</text>
<text x="32" y="1212" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563">Enter a learner id above, or run adapt sandbox seed. A learner we have never seen is a 404, not</text>
<text x="32" y="1230" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4b5563">a fabricated prior.</text>
</svg>
