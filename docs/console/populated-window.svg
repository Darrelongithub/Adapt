<rect x="48" y="974" width="1084" height="1" fill="#DDD2BF"/>
<rect x="24" y="972" width="1132" height="1" fill="#DDD2BF"/>
<text x="48" y="998" font-family="DejaVu Serif, Georgia, serif" font-size="15" font-weight="600" fill="#6B6357">POLLING CHECK</text>
<text x="48" y="1028" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6357">baseline repeat ratio</text>
<text x="348" y="1046" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2230">0.00</text>
<text x="48" y="1076" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6357">connections alerting</text>
<text x="348" y="1094" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#23395B">1</text>
<text x="48" y="1124" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6357">alert threshold</text>
<text x="348" y="1142" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2230">baseline is zero — decided on the raw ratio, so the 5× threshold is not applied</text>
<text x="48" y="1172" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4356">1 of 2 connections is repeating decide on the same learner — with the baseline at zero the</text>
<text x="48" y="1192" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4356">check uses the raw ratio: 11 repeats across 2 connections with decisions in this window,</text>
<text x="48" y="1212" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4356">10-repeat floor. A host retrying for a non-abstention shows up here, not in the bill.</text>
<rect x="24" y="1226" width="1132" height="1" fill="#DDD2BF"/>
<text x="48" y="1252" font-family="DejaVu Serif, Georgia, serif" font-size="15" font-weight="600" fill="#6B6357">BY CONNECTION</text>
<rect x="0" y="1266" width="1180" height="32" fill="#EDE4D4"/>
<text x="48" y="1282" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2230">CONNECTION</text>
