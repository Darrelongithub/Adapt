<text x="348" y="622" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2230">78</text>
<text x="48" y="652" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6357">consumed</text>
<text x="348" y="670" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2230">22</text>
<text x="48" y="700" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6357">held</text>
<text x="348" y="718" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2230">0</text>
<text x="48" y="748" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6357">granted</text>
<text x="348" y="766" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2230">100</text>
<text x="48" y="796" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4356">granted = available + held + consumed + forfeited; consumption reads settles only, so an</text>
<text x="48" y="816" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4356">abstention costs nothing.</text>
