<text x="48" y="1360" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4356">Last-event time and event volume per connection are not on any endpoint yet (UI.md 2.3 asks</text>
<text x="48" y="1380" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4356">for both). The quota and the decision count are; nothing here is invented.</text>
