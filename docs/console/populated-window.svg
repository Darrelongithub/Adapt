<text x="48" y="1512" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4356">Entitled to L1; serving L1 where validation has not passed (capability L1, validated L1).</text>
<text x="48" y="1532" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4356">limited_by is &quot;nothing&quot;: a tenant served at its entitlement is not being withheld from, and</text>
<text x="48" y="1552" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4356">at M1 every construct is L1 — the column is shown rather than hidden.</text>
