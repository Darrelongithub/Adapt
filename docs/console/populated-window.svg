<text x="48" y="1532" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4356">Entitled to L1; serving L1, validated at L1. No gap between entitlement, capability and</text>
<text x="48" y="1552" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4356">validation.</text>
