<text x="48" y="60" font-family="DejaVu Serif, Georgia, serif" font-size="26" font-weight="700" fill="#1B2230">Adapt console</text>
<rect x="48" y="72" width="196" height="2" fill="#C4643F"/>
<text x="48" y="100" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6357">rendered from the console's own renderer; every value traces to an endpoint</text>
<rect x="24" y="124" width="1132" height="1" fill="#DDD2BF"/>
<text x="48" y="150" font-family="DejaVu Serif, Georgia, serif" font-size="15" font-weight="600" fill="#6B6357">ABSTENTION</text>
<text x="48" y="180" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6357">rate</text>
<text x="348" y="198" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#C4643F">0.0%</text>
<text x="48" y="228" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6357">abstentions / decisions</text>
<text x="348" y="246" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2230">0 / 22</text>
<text x="48" y="276" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6357">95% interval</text>
<text x="348" y="294" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2230">[0.0000, 0.1487]</text>
<text x="48" y="324" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6357">served, same denominator</text>
<text x="348" y="342" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2230">100.0%</text>
<text x="48" y="372" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6357">reasons</text>
<text x="348" y="390" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2230">no abstentions in 22 decisions</text>
<text x="48" y="420" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6357">excluded, and counted</text>
<text x="348" y="438" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2230">0 test, 0 paused, 0 replays</text>
<text x="48" y="468" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4356">Rate over 22 valid decisions. 0 test calls, 0 paused-connection calls and 0 replays are</text>
<text x="48" y="488" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4356">excluded and counted.</text>
<text x="48" y="514" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4356">0% abstention on a quiet tenant is not success: it means nothing was asked. The pair is</text>
<text x="48" y="534" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4356">always shown together because either number alone can be gamed.</text>
<rect x="24" y="548" width="1132" height="1" fill="#DDD2BF"/>
<text x="48" y="574" font-family="DejaVu Serif, Georgia, serif" font-size="15" font-weight="600" fill="#6B6357">CREDITS</text>
