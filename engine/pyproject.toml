[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adapt-engine"
version = "0.1.0"
description = "Adapt 2.0 learning intelligence engine (M0 skeleton)"
readme = { text = "Adapt 2.0 engine, milestone 0 skeleton.", content-type = "text/plain" }
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.10,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.0,<6.0",
  "structlog>=24.4,<25.0",
  # AES-GCM for encryption at rest (increment 5). The one crypto dependency:
  # nothing hand-rolled, and no other part of the engine imports it.
  "cryptography>=42,<46",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.28,<1.0",
  "mypy>=1.14",
  "ruff>=0.9",
  # Dev-only bundled PostgreSQL for the tenancy tests. Never a runtime
  # dependency and never installed in the image: the suite reads
  # ADAPT_TEST_DATABASE_URL and any PostgreSQL 16 will do.
  "pgserver==0.1.4",
  # Draws the console screenshot's block model to PNG. Dev-only, and only because
  # this environment has no headless browser to take a real one (KNOWN_GAPS §30).
  "pillow>=10,<14",
]

[project.scripts]
adapt-engine = "adapt_engine.main:main"
adapt = "adapt_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"adapt_engine.console" = ["*.html", "*.css", "*.js", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# Tests favour readable arrange/act blocks: long URLs and nested `with` for
# `pytest.raises(...) as excinfo` are clearer than the compressed forms.
"tests/*" = ["E501", "SIM117"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["adapt_engine"]
