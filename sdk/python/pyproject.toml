[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adapt-sdk"
version = "0.1.0"
description = "Adapt Python SDK (generated from the engine's OpenAPI document)"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["adapt_sdk*"]
